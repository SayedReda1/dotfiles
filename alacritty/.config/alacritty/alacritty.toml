[general]
import = [
	"./themes/catppuccin-mocha.toml"
]

[terminal.shell]
program = "/usr/bin/tmux"

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
opacity = 1
dynamic_padding = true
startup_mode = "Maximized"
#[colors.primary]
#background = "#000000"
#foreground = "#FFFFFF"

[window.padding]
x = 8
y = 3

