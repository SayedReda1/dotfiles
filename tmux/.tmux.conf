# ~/.tmux.conf
# My custom tmux configuration

#--------------------------------------------------------------------------
# Basic Settings & Prefix Key
#--------------------------------------------------------------------------

# Set Ctrl+a as the prefix key
unbind C-b          # Unbind the default prefix Ctrl+b
set-option -g prefix M-a # Set the new prefix globally
bind-key M-a send-prefix # Allow sending Ctrl+a to applications by pressing Ctrl+a twice

# Optional: Shorten command delay
set -sg escape-time 1

# Optional: Start window and pane numbering from 1 (instead of 0)
set -g base-index 1
setw -g pane-base-index 1

#--------------------------------------------------------------------------
# Key Bindings
#--------------------------------------------------------------------------

# --- Pane Navigation with Vim keys (using Prefix) ---
# Select pane on the left
bind-key h select-pane -L
# Select pane below
bind-key j select-pane -D
# Select pane above
bind-key k select-pane -U
# Select pane on the right
bind-key l select-pane -R

# Resize panes with Alt + h/j/k/l
bind -n M-h resize-pane -L 1
bind -n M-l resize-pane -R 1
bind -n M-k resize-pane -U 1
bind -n M-j resize-pane -D 1

# --- Pane Splitting ---
# Split pane horizontally (new pane below current) with Prefix + f
bind-key g split-window -v -c "#{pane_current_path}"

# Split pane vertically (new pane to the right of current) with Prefix + g
bind-key f split-window -h -c "#{pane_current_path}"

# Optional: Remove default split bindings if you ONLY want f/g
# unbind '"'
# unbind %

#--------------------------------------------------------------------------
# Other Useful Options (Optional - uncomment to enable)
#--------------------------------------------------------------------------

# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# Improve colors (if your terminal supports it)
set -g default-terminal "screen-256color"

# Automatically renumber windows when one is closed
set -g renumber-windows on

#--------------------------------------------------------------------------
# End of Configuration
#--------------------------------------------------------------------------

# Optional: Display a message when the config is loaded/reloaded
# display-message "Tmux config loaded: ~/.tmux.conf"

